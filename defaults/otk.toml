# Layers: defaults -> generated auth state -> one operator file -> OTK_* env.
# Operator file: OTK_CONFIG (required when set), otherwise
# ${XDG_CONFIG_HOME:-$HOME/.config}/otk/otk.toml when present, otherwise the
# existing config/otk.toml next to the application source. Only one is loaded.

[log]
level = "info" # OTK_LOG_LEVEL - warn/info/debug; debug includes ignored native event types

[server]
host = "127.0.0.1" # OTK_SERVER_HOST — listener address
port = 1502 # OTK_SERVER_PORT — sidecar HTTP port
origins = [] # OTK_SERVER_ORIGINS — extra browser origins; comma-separated in env

[auth]
type = "" # OTK_AUTH_TYPE — empty means setup; none/password/totp
username = "" # OTK_AUTH_USERNAME — single user's login name
password = "" # OTK_AUTH_PASSWORD — plaintext operator credential; setup stores a hash
secretkey = "" # OTK_AUTH_SECRETKEY — JWT signing key; generated at setup
totpkey = "" # OTK_AUTH_TOTPKEY — raw text key, base32 encoded for TOTP
sessionexpirydays = 30 # OTK_AUTH_SESSIONEXPIRYDAYS — JWT lifetime
cookiename = "" # OTK_AUTH_COOKIENAME — empty means otk_<port>
cookiesamesite = "strict" # OTK_AUTH_COOKIESAMESITE — strict/none; none requires HTTPS

[state]
path = "" # OTK_STATE_PATH — empty means XDG state home/otk/<port>

[storage]
busyms = 5000 # OTK_STORAGE_BUSYMS — user-data SQLite lock wait in milliseconds; nonnegative safe integer

[harness]
type = "opencode-v1" # OTK_HARNESS_TYPE — harness adapter (opencode1 is a deprecated alias)
url = "http://127.0.0.1:4097" # OTK_HARNESS_URL — opencode server base URL
username = "opencode" # OTK_HARNESS_USERNAME — Basic auth username
password = "" # OTK_HARNESS_PASSWORD — empty disables Basic auth
db = "" # OTK_HARNESS_DB — empty means XDG data home/opencode/opencode.db
heartbeattimeout = 25 # OTK_HARNESS_HEARTBEATTIMEOUT — seconds without SSE bytes
reconnectmax = 30 # OTK_HARNESS_RECONNECTMAX — maximum reconnect backoff seconds
requestms = 60000 # OTK_HARNESS_REQUESTMS — classified native read I/O deadline in milliseconds

[catalogs]
# Aggregate native catalog reads; positive count. OTK_CATALOGS_CONCURRENCY
concurrency = 2
# Catalog metadata/access admission; positive count. OTK_CATALOGS_STATCONCURRENCY
statconcurrency = 8
# Fine invalidation keys before full directory reconciliation. OTK_CATALOGS_PENDING
pending = 128

[attachments]
concurrency = 4 # OTK_ATTACHMENTS_CONCURRENCY — aggregate origin/path preparation reads per send, positive count
maxrefs = 64 # OTK_ATTACHMENTS_MAXREFS — maximum attachment references per send, positive count
maxbytes = 33554432 # OTK_ATTACHMENTS_MAXBYTES — combined decoded upload bytes per send

[index]
days = 30 # OTK_INDEX_DAYS — recent-background priority horizon in days; older sessions remain indexed

# Worker digest scheduling and publication policy.
[digest]
idlems = 2000 # OTK_DIGEST_IDLEMS - request-free milliseconds before optional work
parallel = 3 # OTK_DIGEST_PARALLEL - maximum admitted optional entry-batches, including waits
background = false # OTK_DIGEST_BACKGROUND - allow idle backfill without a welcomed client
batch = 100 # OTK_DIGEST_BATCH — header/identity rows per slice, maximum 200
slicems = 8 # OTK_DIGEST_SLICEMS — cooperative budget in milliseconds
cpu = 0.25 # OTK_DIGEST_CPU — maximum observed duty fraction, 0 < value <= 1
memoryreserve = 134217728 # OTK_DIGEST_MEMORYRESERVE — free system bytes reserved for other work
maxpending = 512 # OTK_DIGEST_MAXPENDING — fine-grained keys before full-session reconciliation
publishrows = 64 # OTK_DIGEST_PUBLISHROWS — records per worker publication
retryms = 1000 # OTK_DIGEST_RETRYMS — pressure/error wake-up in milliseconds, not polling
busyms = 100 # OTK_DIGEST_BUSYMS — cooperative derived SQLite lock-readiness wait budget in milliseconds

# Memory-only transcript snapshot/replay policy (server and browser).
[messages]
coolms = 300000 # OTK_MESSAGES_COOLMS — milliseconds after an inactive scope's last interaction before unloading bodies
preloadms = 30000 # OTK_MESSAGES_PRELOADMS — attention-edge warm lease in milliseconds
concurrency = 4 # OTK_MESSAGES_CONCURRENCY — simultaneous body-page reads per connected server in one browser
replayops = 128 # OTK_MESSAGES_REPLAYOPS — retained operations per pending baseline
replaybytes = 4194304 # OTK_MESSAGES_REPLAYBYTES — retained serialized UTF-8 bytes per baseline; minimum 128 bookkeeping bytes
recoveryconcurrency = 2 # OTK_MESSAGES_RECOVERYCONCURRENCY — aggregate simultaneous native missing-seed checkpoint reads per adapter
recoverypending = 128 # OTK_MESSAGES_RECOVERYPENDING — missing message/part identity keys before source-free scoped reconciliation
retryms = 1000 # OTK_MESSAGES_RETRYMS — minimum failed-baseline retry backoff in milliseconds

# Request receipts and pending work; liveness changes status, never the outcome.
[requests]
windowms = 86400000 # OTK_REQUESTS_WINDOWMS — admission window for new intents
retentionms = 86400000 # OTK_REQUESTS_RETENTIONMS — terminal receipt retention after window expiry
maxpending = 512 # OTK_REQUESTS_MAXPENDING — active intent keys per principal
inputbytes = 67108864 # OTK_REQUESTS_INPUTBYTES — retained pending UTF-8 input bytes per principal
resultbytes = 16777216 # OTK_REQUESTS_RESULTBYTES — aggregate volatile replay-result bytes
resumebatch = 64 # OTK_REQUESTS_RESUMEBATCH — refs per control/recovery batch
sweepbatch = 64 # OTK_REQUESTS_SWEEPBATCH — terminal rows/windows per cleanup turn
livenessms = 30000 # OTK_REQUESTS_LIVENESSMS — quiet-work observation interval, not failure
stoppingms = 10000 # OTK_REQUESTS_STOPPINGMS — stopping observation interval, not failure

[connection]
helloms = 10000 # OTK_CONNECTION_HELLOMS — WS hello admission interval
pingms = 20000 # OTK_CONNECTION_PINGMS — application heartbeat interval
silencems = 60000 # OTK_CONNECTION_SILENCEMS — transport silence before reconnect
httpms = 15000 # OTK_CONNECTION_HTTPMS — HTTP no-response liveness interval, never aborts work
retrybase = 1000 # OTK_CONNECTION_RETRYBASE — initial reconnect/reattach delay
retrymax = 30000 # OTK_CONNECTION_RETRYMAX — reconnect/reattach delay ceiling
